name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Authenticate to GitHub Packages without setup-node's registry-url/scope
      # inputs, which write a scope mapping that breaks npm ci.
      - run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc

      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm audit --audit-level=high

      # Build workspace packages in dependency order (their dist/ is required
      # by the root build and tests, and is not committed).
      - run: make build

      # Run every workspace package's tests and the root's, failing unless
      # each one is at 100% coverage.
      - run: make coverage

      # Verify the root and every workspace package tarball contain only their
      # "files" allowlist + npm metadata. Runs after coverage so coverage/ exists
      # on disk; this proves the allowlists keep it (and test/, etc.) out.
      - run: make pack-check
