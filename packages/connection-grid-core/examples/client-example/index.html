<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Connection-Grid-Core Example</title>
    <meta name="description" content="Connection Grid Core Example">
    <!--
      Loads the LOCAL builds (run `make build` from the repo root first).
      Serve the repo ROOT and open this page by path so the relative dist
      paths resolve (this example also loads its grid-square dependency):
        cd <repo root> && python3 -m http.server 8000
        open http://localhost:8000/packages/connection-grid-core/examples/client-example/
    -->
    <script src="../../dist/connection-grid-core.js"></script>
    <script src="../../../grid-square/dist/grid-square.js"></script>
    <script>
      var factory = window.MitchAllen.ConnectionGridCore;
      var squareFactory = window.MitchAllen.GridSquare;
      console.log(factory);
      var xSize = 10, ySize = 5;
      var sourceGrid = squareFactory.create({ x: xSize, y: ySize });
      var _dirMap = {
        "N": 0x010,
        "S": 0x020,
        "E": 0x040,
        "W": 0x080 };
      let _oppositeMap = { "E": "W", "W": "E", "N": "S", "S": "N" };
      var cg = factory.create({
        grid: sourceGrid,
        dirMap: _dirMap,
        oppositeMap: _oppositeMap
      });
      console.log(cg);
    </script>
  </head>
  <body>
    <h1>Connection Grid Core Example</h1>
    <hr size="1" />
    <p>See JavaScript console</p>
  </body>
</html>
