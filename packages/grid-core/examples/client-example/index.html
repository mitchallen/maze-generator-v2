<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Grid Core Example</title>
    <meta name="description" content="Grid Core Example">
    <!--
      Loads the LOCAL build (run `make build` from the repo root first).
      Serve the repo ROOT and open this page by path so the relative dist
      path resolves:
        cd <repo root> && python3 -m http.server 8000
        open http://localhost:8000/packages/grid-core/examples/client-example/
    -->
    <script src="../../dist/grid-core.js"></script>
    <script>
      var factory = window.MitchAllen.GridCore;
      console.log(factory);
      var rows = 5;
      var gc = factory.create( { rows: rows } );
      gc.set(rows-1,6,"alpha");
      console.log(gc);
      gc.log();
    </script>
  </head>
  <body>
    <h1>Grid Core Example</h1>
    <p>See JavaScript developer console for output.</p>
  </body>
</html>
