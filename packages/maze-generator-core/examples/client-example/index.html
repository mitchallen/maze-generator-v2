<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Maze Generator Core Example</title>
    <meta name="description" content="Maze Generator Core Example">
    <!--
      Loads the LOCAL builds (run `make build` from the repo root first).
      Serve the repo ROOT and open this page by path so the relative dist
      paths resolve (this example also loads its connection-grid-square
      dependency):
        cd <repo root> && python3 -m http.server 8000
        open http://localhost:8000/packages/maze-generator-core/examples/client-example/
    -->
    <script src="../../dist/maze-generator-core.js"></script>
    <script src="../../../connection-grid-square/dist/connection-grid-square.js"></script>
    <script>
      var cgFactory = window.MitchAllen.ConnectionGridSquare;
      console.log(cgFactory);
      var xSize = 10, ySize = 5;
      var cGrid = cgFactory.create( { x: xSize, y: ySize } );
      var factory = window.MitchAllen.MazeGeneratorCore;
      var sm = factory.create({
        grid: cGrid,
      });
      console.log(sm);
      sm.generate();
      sm.log();
    </script>
  </head>
  <body>
    <h1>Maze Generator Core Example</h1>
    <p>See JavaScript developer console for output.</p>
  </body>
</html>
