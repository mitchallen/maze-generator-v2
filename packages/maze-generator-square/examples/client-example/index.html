<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Maze Generator Square Example</title>
    <meta name="description" content="Maze Generator Square Example">
    <!--
      Loads the LOCAL build (run `make build` from the repo root first).
      Serve the repo ROOT and open this page by path so the relative dist
      path resolves:
        cd <repo root> && python3 -m http.server 8000
        open http://localhost:8000/packages/maze-generator-square/examples/client-example/
    -->
    <script src="../../dist/maze-generator-square.js"></script>
    <script>
      var factory = window.MitchAllen.MazeGeneratorSquare;
      console.log(factory);
      var xSize = 10, ySize = 5;
      var sm = factory.create( { x: xSize, y: ySize } );
      console.log(sm);
      sm.generate();
      sm.printBoard();
      // open borders
      var options = {
        open: [
          { border: "N", list: [0] },
          { border: "S", list: [xSize-1] }
        ]
      };
      sm.generate(options);
      sm.printBoard();
    </script>
  </head>
  <body>
    <h1>Maze Generator Square Example</h1>
    <p>See JavaScript developer console for output.</p>
  </body>
</html>
