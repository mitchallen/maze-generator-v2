<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Connection-Grid-Square Example</title>
    <meta name="description" content="Connection Grid Square Example">
    <!--
      Loads the LOCAL build (run `make build` from the repo root first).
      Serve the repo ROOT and open this page by path so the relative dist
      path resolves:
        cd <repo root> && python3 -m http.server 8000
        open http://localhost:8000/packages/connection-grid-square/examples/client-example/
    -->
    <script src="../../dist/connection-grid-square.js"></script>
    <script>
      var factory = window.MitchAllen.ConnectionGridSquare;
      console.log(factory);
      var xSize = 10, ySize = 5;
      var sg = factory.create( { x: xSize, y: ySize } );
      console.log(sg);
      sg.log();
    </script>
  </head>
  <body>
    <h1>Connection Grid Square Example</h1>
    <p>See JavaScript console</p>
  </body>
